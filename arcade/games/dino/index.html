<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦖 Khủng Long Khánh Như</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">← Về</a>
        <h1 class="game-title">🦖 Khủng Long</h1>
        <div class="score-display">
            <div class="score-item">
                <span class="score-label">Điểm</span>
                <span class="score-value" id="current-score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Kỷ lục</span>
                <span class="score-value" id="high-score">0</span>
            </div>
        </div>
    </header>

    <div class="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Start Overlay -->
        <div class="game-overlay" id="start-overlay">
            <div class="overlay-icon">🦖</div>
            <div class="overlay-title">Khủng Long Khánh Như</div>
            <div class="overlay-subtitle">Chạm màn hình hoặc nhấn SPACE để nhảy!</div>
            <button class="start-btn" id="start-btn">🎮 Bắt đầu</button>
        </div>

        <!-- Game Over Overlay -->
        <div class="game-overlay hidden" id="gameover-overlay">
            <div class="overlay-icon">💔</div>
            <div class="overlay-title">Game Over!</div>
            <div class="overlay-score" id="final-score">Điểm: 0</div>
            <div id="highscore-message"></div>
            <button class="start-btn" id="restart-btn">🔄 Chơi lại</button>
        </div>
    </div>

    <!-- Mobile Touch Area -->
    <div class="touch-controls">
        <button class="touch-btn jump-btn" id="jump-btn">
            <span>⬆️</span>
            <small>NHẢY</small>
        </button>
        <button class="touch-btn duck-btn" id="duck-btn">
            <span>⬇️</span>
            <small>CÚI</small>
        </button>
    </div>

    <div class="instructions">
        <div class="instructions-card">
            <h3>📖 Cách chơi</h3>
            <p>• Chạm <strong>NHẢY</strong> hoặc nhấn <strong>SPACE/↑</strong> để nhảy</p>
            <p>• Giữ <strong>CÚI</strong> hoặc nhấn <strong>↓</strong> để cúi xuống</p>
            <p>• Thu thập 💎 để được thêm điểm!</p>
        </div>
    </div>

    <script src="../../sound-manager.js"></script>
    <script src="game.js"></script>
</body>

</html>
