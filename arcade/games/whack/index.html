<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔨 Đập Dập Đập!!! - Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">← Về</a>
        <h1 class="game-title">🔨 Đập Dập Đập!!!</h1>
        <div class="score-display">
            <div class="score-item">
                <span class="score-label">Điểm</span>
                <span class="score-value" id="current-score">0</span>
            </div>
            <div class="stat-box">
                <div class="stat-icon">⏰</div>
                <div class="stat-value" id="timer">45</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">💣</div>
                <div class="stat-value" id="bombs-count">0/5</div>
            </div>
            <div class="score-item">
                <span class="score-label">Kỷ lục</span>
                <span class="score-value" id="high-score">0</span>
            </div>
        </div>
    </header>

    <div class="game-container">
        <div class="game-board" id="game-board"></div>

        <div class="game-overlay" id="start-overlay">
            <div class="overlay-icon">🐭</div>
            <div class="overlay-title">Đập Dập Đập!!!</div>
            <div class="overlay-subtitle">Chạm nhanh vào chuột xuất hiện!</div>
            <button class="start-btn" id="start-btn">🎮 Bắt đầu</button>
        </div>

        <div class="game-overlay hidden" id="gameover-overlay">
            <div class="overlay-icon">🏆</div>
            <div class="overlay-title">Hết giờ!</div>
            <div class="overlay-score" id="final-score">Điểm: 0</div>
            <div id="highscore-message"></div>
            <button class="start-btn" id="restart-btn">🔄 Chơi lại</button>
        </div>
    </div>

    <div class="instructions">
        <div class="instructions-card">
            <h3>📖 Cách chơi</h3>
            <p>• Chạm/click vào chuột để đập (+10đ)</p>
            <p>• Chuột vàng +30đ • Đừng đập Bom 💣 (-20đ)!</p>
        </div>
    </div>

    <script src="../../sound-manager.js"></script>
    <script src="game.js"></script>
</body>

</html>
